<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>blackhole post</title>
  <style>
    body {
      background-color: #0a0a0a;
      color: #f0f0f0;
      font-family: "Courier New", monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    #form-container {
      max-width: 500px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .step {
      display: none;
      flex-direction: column;
      gap: 15px;
    }

    .step.active {
      display: flex;
    }

    button,
    input[type="submit"] {
      background-color: #222;
      color: #f0f0f0;
      border: 1px solid #f0f0f0;
      padding: 10px 15px;
      cursor: pointer;
      font-family: "Courier New", monospace;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      background-color: #111;
      border: 1px solid #444;
      color: #f0f0f0;
      padding: 10px;
      font-family: "Courier New", monospace;
      width: 100%;
    }

    label {
      display: block;
    }

    .radio-group label {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .thank-you {
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="form-container">
    <form id="blackholeForm">
      <!-- Шаг 1 -->
      <div class="step active" id="step1">
        <p>Make a choice</p>
        <div class="radio-group">
          <label>
            <input type="radio" name="mode" value="wish" required />
            Make a wish into the universe (314% guaranteed to come true)
          </label>
          <label>
            <input type="radio" name="mode" value="question" />
            Ask your most burning question into the black hole (3.14% chance of reply)
          </label>
        </div>
        <button type="button" onclick="nextStep()">Next</button>
      </div>

      <!-- Шаг 2 -->
      <div class="step" id="step2">
        <p id="prompt-text"></p>
        <textarea
          name="message"
          rows="4"
          required
          placeholder="Write here..."
        ></textarea>
        <input
          type="email"
          name="email"
          placeholder="Email (if you want to receive a reply)"
        />
        <button type="button" onclick="nextStep()">Next</button>
      </div>

      <!-- Шаг 3 -->
      <div class="step" id="step3">
        <p>Can we use your response in an art project?</p>
        <div class="radio-group">
          <label><input type="radio" name="consent" value="yes" required /> Yes</label>
          <label><input type="radio" name="consent" value="no" /> No</label>
        </div>
        <input type="submit" value="Submit" />
      </div>

      <!-- Шаг 4 -->
      <div class="step" id="step4">
        <div class="thank-you">
          <p>Thank you. Your message has been transmitted.</p>
        </div>
      </div>
    </form>
  </div>

  <script>
    let currentStep = 1;
    const form = document.getElementById("blackholeForm");

    function showStep(step) {
      document
        .querySelectorAll(".step")
        .forEach((div) => div.classList.remove("active"));
      document.getElementById("step" + step).classList.add("active");
    }

    function nextStep() {
      if (currentStep === 1) {
        const choice = form.mode.value;
        document.getElementById("prompt-text").textContent =
          choice === "wish"
            ? "Write your wish below."
            : "Write your question below.";
      }
      currentStep++;
      showStep(currentStep);
    }

    form.addEventListener("submit", function (e) {
  e.preventDefault();

  const data = {
    mode: form.mode.value,
    message: form.message.value,
    email: form.email.value,
    consent: form.consent.value
  };

  fetch("https://script.google.com/macros/s/AKfycby2OKBWzBUaIIuvE74DXxUsbI_NX8zwPkAhqhRq450iu8JyEmZHAAv_3zOJg9UMEFB22Q/exec", {
    method: "POST",
    body: JSON.stringify(data),
    headers: { "Content-Type": "application/json" }
  }).then(() => {
    showStep(4);
  }).catch(() => {
    alert("Something went wrong.");
  });
});

  </script>
</body>
</html>
