<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>blackhole post</title>
  <style>
    body {
      background-color: #0a0a0a;
      color: #f0f0f0;
      font-family: "Courier New", monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    #form-container {
      max-width: 500px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .step {
      display: none;
      flex-direction: column;
      gap: 15px;
    }
    .step.active {
      display: flex;
    }
    button,
    input[type="submit"] {
      background-color: #222;
      color: #f0f0f0;
      border: 1px solid #f0f0f0;
      padding: 10px 15px;
      cursor: pointer;
      font-family: "Courier New", monospace;
    }
    input[type="text"],
    input[type="email"],
    textarea {
      background-color: #111;
      border: 1px solid #444;
      color: #f0f0f0;
      padding: 10px;
      font-family: "Courier New", monospace;
      width: 100%;
    }
    .radio-group label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 24px;
      line-height: 1.3;
    }
    .radio-text {
      display: flex;
      flex-direction: column;
    }
    .radio-main {
      display: block;
    }
    .radio-sub {
      display: block;
      font-size: 0.85em;
      opacity: 0.7;
      margin-top: 2px;
    }
    .thank-you {
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="form-container">
    <form id="blackholeForm">
      <div class="step active" id="step1">
        <p>Make a choice</p>
        <div class="radio-group">
          <label>
            <input type="radio" name="mode" value="wish" required />
